<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fable">
<meta name="theme-color" content="#111417">
<meta http-equiv="refresh" content="900">
<link rel="apple-touch-icon" href="icon.png">
<style>
 @media (max-width:700px){
  body{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .grid{grid-template-columns:1fr !important}
  .card{min-width:calc(50% - 6px);flex:1 1 calc(50% - 6px);padding:10px 12px}
  .card .v{font-size:17px}
  h1{font-size:18px;padding-top:env(safe-area-inset-top)}
  table{font-size:11px} th,td{padding:4px 5px}
 }
 .js-plotly-plot,.plot-container{max-width:100%}
</style><title>Fable Trader — Dummy Run Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
 body{background:#111417;color:#e8e6e1;font-family:Segoe UI,system-ui,sans-serif;margin:0;padding:18px}
 h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:26px 0 8px;color:#f0862b}
 .sub{color:#8a8f98;font-size:12px;margin-bottom:14px}
 .cards{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
 .card{background:#1a1e23;border:1px solid #2a2f36;border-radius:10px;padding:12px 16px;min-width:130px}
 .card .k{font-size:11px;color:#8a8f98;text-transform:uppercase;letter-spacing:.5px}
 .card .v{font-size:20px;font-weight:600;margin-top:2px}
 .pos{color:#4caf7d}.neg{color:#e05d5d}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
 .panel{background:#1a1e23;border:1px solid #2a2f36;border-radius:10px;padding:8px}
 table{border-collapse:collapse;width:100%;font-size:12px}
 th,td{padding:5px 8px;border-bottom:1px solid #2a2f36;text-align:left}
 th{color:#8a8f98;font-weight:600} tr:hover{background:#20252b}
 .formula{font-family:Consolas,monospace;font-size:12px;background:#14171b;border-left:3px solid #f0862b;
  padding:8px 10px;border-radius:4px;margin:6px 0;white-space:pre-wrap}
</style></head><body>
<h1>Fable Trader — Dummy Run Dashboard</h1>
<div class="sub" id="sub"></div>
<div class="cards" id="cards"></div>
<h2>Equity Curve &amp; Per-Trade P&amp;L</h2>
<div class="grid"><div class="panel"><div id="equity" style="height:300px"></div></div>
<div class="panel"><div id="rbars" style="height:300px"></div></div></div>
<h2 id="chartsHead">Price Charts — entries ▲▼, exits ✕, open stop/target lines</h2>
<div class="grid" id="charts"></div>
<h2>Self-Learning: the four dials per setup</h2>
<div class="grid">
 <div class="panel"><div id="dials" style="height:320px"></div></div>
 <div class="panel"><div id="expect" style="height:320px"></div></div>
</div>
<h2>Self-Learning: adjustment timeline (what changed, when)</h2>
<div class="panel"><div id="adjline" style="height:300px"></div></div>
<h2>The calculations, live</h2>
<div id="calcs"></div>
<h2>Recent adjustments (audit trail)</h2>
<div class="panel" style="max-height:320px;overflow:auto"><table id="adjtable"></table></div>
<script>
const D = {"generated": "2026-11-10 06:01 UTC", "interval": "1h", "markets": {"us": {"currency": "USD", "start_eq": 10000, "equity": 9852.46, "trades": 0, "wins": 0, "open": 4, "eq_t": [], "eq_v": []}, "asx": {"currency": "AUD", "start_eq": 15000, "equity": 15320.39, "trades": 0, "wins": 0, "open": 3, "eq_t": [], "eq_v": []}, "japan": {"currency": "JPY", "start_eq": 1500000, "equity": 1483364.97, "trades": 3, "wins": 0, "open": 0, "eq_t": ["2026-11-09T01", "2026-11-10T01", "2026-11-10T02"], "eq_v": [1491051.55, 1479418.27, 1468895.45]}}, "last_run": {"date": "2026-11-10", "run_ts": "2026-11-10T06", "markets": {"us": {"market": "us", "currency": "USD", "equity": 9852.46, "drawdown_pct": 0.0, "kill_switch": false, "open_positions": 4, "closed": 0, "signals_seen": 0, "approved": 0}, "asx": {"market": "asx", "currency": "AUD", "equity": 15320.39, "drawdown_pct": 0.0, "kill_switch": false, "open_positions": 3, "closed": 0, "signals_seen": 0, "approved": 0}, "japan": {"market": "japan", "currency": "JPY", "equity": 1483364.97, "drawdown_pct": 2.05, "kill_switch": false, "open_positions": 0, "closed": 0, "signals_seen": 0, "approved": 0}}}, "trades": [{"trade_id": "a134f891a0", "symbol": "6861.T", "side": "short", "entry_date": "2026-11-06", "entry_price": "67380.0", "exit_date": "2026-11-09", "exit_price": "71784.6429", "quantity": "2", "setup": "breakout", "score": "100", "planned_stop": "71784.6429", "planned_target": "58570.7143", "exit_reason": "stop", "pnl": "-8948.45", "r_multiple": "-1.016", "mae_r": "-1.308", "mfe_r": "0.082", "entry_ts": "2026-11-06T01", "exit_ts": "2026-11-09T01", "market": "japan"}, {"trade_id": "b24ee0b271", "symbol": "4063.T", "side": "short", "entry_date": "2026-11-06", "entry_price": "5350.0", "exit_date": "2026-11-10", "exit_price": "5697.0", "quantity": "33", "setup": "breakout", "score": "100", "planned_stop": "5590.75", "planned_target": "4868.5", "exit_reason": "stop", "pnl": "-11633.28", "r_multiple": "-1.464", "mae_r": "-1.504", "mfe_r": "0.249", "entry_ts": "2026-11-06T03", "exit_ts": "2026-11-10T01", "market": "japan"}, {"trade_id": "0694277317", "symbol": "6501.T", "side": "short", "entry_date": "2026-11-06", "entry_price": "4564.0", "exit_date": "2026-11-10", "exit_price": "4898.7143", "quantity": "31", "setup": "breakout", "score": "100", "planned_stop": "4898.7143", "planned_target": "3894.5714", "exit_reason": "stop", "pnl": "-10522.82", "r_multiple": "-1.014", "mae_r": "-1.049", "mfe_r": "0.221", "entry_ts": "2026-11-06T03", "exit_ts": "2026-11-10T02", "market": "japan"}], "adjustments": [], "positions": [{"trade_id": "c8b952eccd", "symbol": "GOOGL", "side": "short", "entry_date": "2026-10-30", "entry_price": 283.75, "quantity": 4, "stop": 299.9779, "initial_stop": 299.9779, "be_moved": false, "target": 251.2943, "setup": "breakout", "score": 100, "entry_ts": "2026-10-30T06", "mae_price": 295.6000061035156, "mfe_price": 276.9200134277344, "market": "us"}, {"trade_id": "240a65bb34", "symbol": "META", "side": "short", "entry_date": "2026-10-30", "entry_price": 624.545, "quantity": 1, "stop": 666.6179, "initial_stop": 666.6179, "be_moved": false, "target": 540.3992, "setup": "momentum", "score": 100, "entry_ts": "2026-10-30T06", "mae_price": 647.2000122070312, "mfe_price": 583.7999877929688, "market": "us"}, {"trade_id": "fe15452400", "symbol": "QQQ", "side": "short", "entry_date": "2026-11-05", "entry_price": 667.36, "quantity": 1, "stop": 690.0257, "initial_stop": 690.0257, "be_moved": false, "target": 622.0286, "setup": "breakout", "score": 98.0, "entry_ts": "2026-11-05T15", "mae_price": 681.4683837890625, "mfe_price": 647.27001953125, "market": "us"}, {"trade_id": "72720e6701", "symbol": "SPY", "side": "short", "entry_date": "2026-11-05", "entry_price": 741.765, "quantity": 1, "stop": 757.7609, "initial_stop": 757.7609, "be_moved": false, "target": 709.7732, "setup": "breakout", "score": 100, "entry_ts": "2026-11-05T16", "mae_price": 755.2100219726562, "mfe_price": 732.7100219726562, "market": "us"}, {"trade_id": "39176e5c4e", "symbol": "CBA.AX", "side": "long", "entry_date": "2026-10-30", "entry_price": 166.72, "quantity": 11, "stop": 161.0006, "initial_stop": 161.0006, "be_moved": false, "target": 178.1589, "setup": "momentum", "score": 94.2, "entry_ts": "2026-10-30T06", "mae_price": 163.83999633789062, "mfe_price": 169.83999633789062, "market": "asx"}, {"trade_id": "d427b8a6a7", "symbol": "CSL.AX", "side": "long", "entry_date": "2026-10-30", "entry_price": 200.73, "quantity": 9, "stop": 195.1371, "initial_stop": 195.1371, "be_moved": false, "target": 211.9157, "setup": "breakout", "score": 85.5, "entry_ts": "2026-10-30T06", "mae_price": 195.43499755859375, "mfe_price": 202.85000610351562, "market": "asx"}, {"trade_id": "c0be24f408", "symbol": "WDS.AX", "side": "short", "entry_date": "2026-11-05", "entry_price": 30.385, "quantity": 60, "stop": 31.8577, "initial_stop": 31.8577, "be_moved": false, "target": 27.4396, "setup": "breakout", "score": 100, "entry_ts": "2026-11-05T01", "mae_price": 31.229999542236328, "mfe_price": 30.31999969482422, "market": "asx"}], "learner": {"momentum": {"trades": 0, "wins": 0, "ema_r": 0.0, "ema_mae_r": 0.0, "ema_mfe_r": 0.0, "size_mult": 1.0, "threshold_shift": 0.0, "stop_mult": null, "target_r": null}, "pullback": {"trades": 0, "wins": 0, "ema_r": 0.0, "ema_mae_r": 0.0, "ema_mfe_r": 0.0, "size_mult": 1.0, "threshold_shift": 0.0, "stop_mult": null, "target_r": null}, "breakout": {"trades": 3, "wins": 0, "ema_r": -1.0728199999999999, "ema_mae_r": -1.29414, "ema_mfe_r": 0.1241425, "size_mult": 1.0, "threshold_shift": 0.0, "stop_mult": null, "target_r": null}}, "candles": {}, "ema_alpha": 0.15, "base": {"stop_mult": 1.5, "target_r": 2.2, "min_score": 60, "risk_pct": 1.0, "hard_cap": 1.25}};
const L={paper_bgcolor:'#1a1e23',plot_bgcolor:'#1a1e23',font:{color:'#c8ccd2',size:11},
 margin:{l:45,r:15,t:30,b:35},xaxis:{gridcolor:'#262b31'},yaxis:{gridcolor:'#262b31'}};
document.getElementById('sub').textContent=`generated ${D.generated} · ${D.interval} bars · paper trading only`;
// ---- summary cards (per market)
const mkCards=[];
for(const [m,v] of Object.entries(D.markets)){
 const pnl=(v.equity-v.start_eq);
 mkCards.push([`${m.toUpperCase()} equity`,v.equity.toLocaleString(undefined,{maximumFractionDigits:0})+' '+v.currency,pnl>=0]);
 mkCards.push([`${m.toUpperCase()} P&L / trades`,`${pnl>=0?'+':''}${pnl.toFixed(0)} / ${v.trades} (${v.open} open)`,pnl>=0]);
}
mkCards.push(['Total closed trades',D.trades.length,null]);
mkCards.push(['Learner adjustments',D.adjustments.length,null]);
document.getElementById('cards').innerHTML=mkCards.map(([k,v,g])=>
 `<div class="card"><div class="k">${k}</div><div class="v ${g===null?'':g?'pos':'neg'}">${v}</div></div>`).join('');
// ---- equity per market (indexed to 100) + R bars
Plotly.newPlot('equity',Object.entries(D.markets).map(([m,v])=>({x:v.eq_t,
 y:v.eq_v.map(x=>100*x/v.start_eq),mode:'lines',name:m,line:{width:2}})),
 {...L,title:{text:'Equity per market (indexed, start = 100)',font:{size:13}}},{displayModeBar:false});
Plotly.newPlot('rbars',[{x:D.trades.map((t,i)=>i+1),y:D.trades.map(t=>parseFloat(t.r_multiple)),type:'bar',
 marker:{color:D.trades.map(t=>parseFloat(t.r_multiple)>0?'#4caf7d':'#e05d5d')},
 text:D.trades.map(t=>t.market+' '+t.symbol+' '+t.setup),hoverinfo:'text+y'}],
 {...L,title:{text:'R multiple per trade (all markets - currency-neutral)',font:{size:13}}},{displayModeBar:false});
// ---- candles with markers
const chartsDiv=document.getElementById('charts');
for(const [sym,c] of Object.entries(D.candles)){
 const div=document.createElement('div');div.className='panel';
 const id='ch_'+sym;div.innerHTML=`<div id="${id}" style="height:340px"></div>`;chartsDiv.appendChild(div);
 const data=[{x:c.t,open:c.o,high:c.h,low:c.l,close:c.c,type:'candlestick',name:sym,
   increasing:{line:{color:'#4caf7d'}},decreasing:{line:{color:'#e05d5d'}}}];
 const first=c.t[0];
 const tr=D.trades.filter(t=>t.symbol===sym&&(t.entry_ts||t.entry_date)>=first.slice(0,10));
 const near=ts=>{if(!ts)return null;const k=c.t.findIndex(x=>x>=ts);return k<0?c.t[c.t.length-1]:c.t[k];};
 const ent=tr.map(t=>({x:near(t.entry_ts||t.entry_date),y:parseFloat(t.entry_price),s:t.side,txt:`${t.setup} ${t.side} @${t.entry_price}`}));
 data.push({x:ent.map(e=>e.x),y:ent.map(e=>e.y),mode:'markers',name:'entry',
   marker:{symbol:ent.map(e=>e.s==='long'?'triangle-up':'triangle-down'),size:11,color:'#f0c14b'},
   text:ent.map(e=>e.txt),hoverinfo:'text'});
 data.push({x:tr.map(t=>near(t.exit_ts||t.exit_date)),y:tr.map(t=>parseFloat(t.exit_price)),mode:'markers',
   name:'exit',marker:{symbol:'x',size:10,color:'#7ab8f5'},
   text:tr.map(t=>`exit ${t.exit_reason} pnl ${t.pnl} (${t.r_multiple}R)`),hoverinfo:'text'});
 const shapes=[];
 for(const p of D.positions.filter(p=>p.symbol===sym)){
  shapes.push({type:'line',x0:first,x1:c.t[c.t.length-1],y0:p.stop,y1:p.stop,line:{color:'#e05d5d',dash:'dot',width:1}});
  shapes.push({type:'line',x0:first,x1:c.t[c.t.length-1],y0:p.target,y1:p.target,line:{color:'#4caf7d',dash:'dot',width:1}});
  data.push({x:[near(p.entry_ts||p.entry_date)],y:[p.entry_price],mode:'markers',name:'open entry',
    marker:{symbol:p.side==='long'?'triangle-up':'triangle-down',size:13,color:'#f0862b'},
    text:[`OPEN ${p.setup} ${p.side} @${p.entry_price} stop ${p.stop} target ${p.target}`],hoverinfo:'text'});
 }
 Plotly.newPlot(id,data,{...L,title:{text:sym,font:{size:14}},shapes,showlegend:false,
   xaxis:{...L.xaxis,rangeslider:{visible:false}}},{displayModeBar:false});
}
if(!Object.keys(D.candles).length)document.getElementById('chartsHead').textContent+=' — no chart data yet';
// ---- learner dials
const setups=Object.keys(D.learner);
const dial=(name,key,base)=>({x:setups,y:setups.map(s=>{const v=D.learner[s][key];return v==null?base:v;}),
 type:'bar',name});
Plotly.newPlot('dials',[dial('size_mult','size_mult',1),dial('stop_mult (ATR)','stop_mult',D.base.stop_mult),
 dial('target_r','target_r',D.base.target_r)],
 {...L,barmode:'group',title:{text:'Learned dials per setup (vs base)',font:{size:13}},
  shapes:[{type:'line',x0:-.5,x1:setups.length-.5,y0:1,y1:1,line:{color:'#8a8f98',dash:'dash',width:1}}]},
 {displayModeBar:false});
Plotly.newPlot('expect',[{x:setups,y:setups.map(s=>D.learner[s].ema_r),type:'bar',name:'expectancy (EMA R)',
  marker:{color:setups.map(s=>D.learner[s].ema_r>=0?'#4caf7d':'#e05d5d')}},
 {x:setups,y:setups.map(s=>D.learner[s].threshold_shift),type:'bar',name:'threshold shift',marker:{color:'#7ab8f5'}}],
 {...L,barmode:'group',title:{text:'Expectancy & entry-threshold shift',font:{size:13}}},{displayModeBar:false});
// ---- adjustment timeline: size_mult per setup over time
const bySetup={};
for(const a of D.adjustments){if(a.dial!=='size_mult'||a.setup==='GLOBAL')continue;
 (bySetup[a.setup]??=({x:[],y:[]})).x.push(a.timestamp);bySetup[a.setup].y.push(parseFloat(a.new));}
Plotly.newPlot('adjline',Object.entries(bySetup).map(([s,d])=>({x:d.x,y:d.y,mode:'lines+markers',name:s,
 line:{shape:'hv'}})),{...L,title:{text:'Position-size multiplier over time (per setup)',font:{size:13}}},
 {displayModeBar:false});
// ---- live calculations
const a=D.ema_alpha;
document.getElementById('calcs').innerHTML=setups.map(s=>{const p=D.learner[s];
 const stop=p.stop_mult??D.base.stop_mult, tr=p.target_r??D.base.target_r;
 const risk=Math.min(D.base.risk_pct*p.size_mult,D.base.hard_cap).toFixed(2);
 return `<div class="panel" style="margin-bottom:10px"><b>${s}</b> — ${p.trades} trades, ${p.wins} wins
 <div class="formula">expectancy:  ema_r = ${(1-a)}·prev + ${a}·latest_R  =  ${(+p.ema_r).toFixed(3)} R
excursions:  ema_mae = ${(+p.ema_mae_r).toFixed(2)}R   ema_mfe = ${(+p.ema_mfe_r).toFixed(2)}R
size:        risk/trade = min(${D.base.risk_pct}% × ${p.size_mult}, ${D.base.hard_cap}% cap) = ${risk}%
entry bar:   score must beat ${D.base.min_score} + ${p.threshold_shift} = ${(D.base.min_score+ +p.threshold_shift).toFixed(1)}
trade plan:  stop = entry ∓ ${stop} × ATR      target = entry ± ${tr} × risk (RR 1:${tr})</div></div>`;}).join('')
 ||'<div class="sub">No closed trades yet — calculations appear after the first exits.</div>';
// ---- audit table
const rows=D.adjustments.slice(-40).reverse();
document.getElementById('adjtable').innerHTML='<tr><th>time</th><th>setup</th><th>dial</th><th>old→new</th><th>reason</th></tr>'+
 rows.map(r=>`<tr><td>${r.timestamp.slice(0,16).replace('T',' ')}</td><td>${r.setup}</td><td>${r.dial}</td>
 <td>${r.old} → ${r.new}</td><td>${r.reason}</td></tr>`).join('');
</script><script>window.addEventListener("resize",()=>document.querySelectorAll(".js-plotly-plot").forEach(p=>Plotly.Plots.resize(p)));</script></body></html>
