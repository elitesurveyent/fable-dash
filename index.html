 {...L,title:{text:'Equity per market (indexed, start = 100)',font:{size:13}}},{displayModeBar:false});

 marker:{color:D.trades.map(t=>parseFloat(t.r_multiple)>0?'#4caf7d':'#e05d5d')},
 text:D.trades.map(t=>t.market+' '+t.symbol+' '+t.setup),hoverinfo:'text+y'}],
 {...L,title:{text:'R multiple per trade (all markets - currency-neutral)',font:{size:13}}},{displayModeBar:false});
// ---- candles with markers
const chartsDiv=document.getElementById('charts');
for(const [sym,c] of Object.entries(D.candles)){
 const div=document.createElement('div');div.className='panel';
 const id='ch_'+sym;div.innerHTML=`<div id="${id}" style="height:340px"></div>`;chartsDiv.appendChild(div);
 const data=[{x:c.t,open:c.o,high:c.h,low:c.l,close:c.c,type:'candlestick',name:sym,
   increasing:{line:{color:'#4caf7d'}},decreasing:{line:{color:'#e05d5d'}}}];
 const first=c.t[0];
 const tr=D.trades.filter(t=>t.symbol===sym&&(t.entry_ts||t.entry_date)>=first.slice(0,10));
 const near=ts=>{if(!ts)return null;const k=c.t.findIndex(x=>x>=ts);return k<0?c.t[c.t.length-1]:c.t[k];};
 const ent=tr.map(t=>({x:near(t.entry_ts||t.entry_date),y:parseFloat(t.entry_price),s:t.side,txt:`${t.setup} ${t.side} @${t.entry_price}`}));
 data.push({x:ent.map(e=>e.x),y:ent.map(e=>e.y),mode:'markers',name:'entry',
   marker:{symbol:ent.map(e=>e.s==='long'?'triangle-up':'triangle-down'),size:11,color:'#f0c14b'},
   text:ent.map(e=>e.txt),hoverinfo:'text'});
 data.push({x:tr.map(t=>near(t.exit_ts||t.exit_date)),y:tr.map(t=>parseFloat(t.exit_price)),mode:'markers',
   name:'exit',marker:{symbol:'x',size:10,color:'#7ab8f5'},
   text:tr.map(t=>`exit ${t.exit_reason} pnl ${t.pnl} (${t.r_multiple}R)`),hoverinfo:'text'});
 const shapes=[];
 for(const p of D.positions.filter(p=>p.symbol===sym)){
  shapes.push({type:'line',x0:first,x1:c.t[c.t.length-1],y0:p.stop,y1:p.stop,line:{color:'#e05d5d',dash:'dot',width:1}});
  shapes.push({type:'line',x0:first,x1:c.t[c.t.length-1],y0:p.target,y1:p.target,line:{color:'#4caf7d',dash:'dot',width:1}});
  data.push({x:[near(p.entry_ts||p.entry_date)],y:[p.entry_price],mode:'markers',name:'open entry',
    marker:{symbol:p.side==='long'?'triangle-up':'triangle-down',size:13,color:'#f0862b'},
    text:[`OPEN ${p.setup} ${p.side} @${p.entry_price} stop ${p.stop} target ${p.target}`],hoverinfo:'text'});
 }
 Plotly.newPlot(id,data,{...L,title:{text:sym,font:{size:14}},shapes,showlegend:false,
   xaxis:{...L.xaxis,rangeslider:{visible:false}}},{displayModeBar:false});
}
if(!Object.keys(D.candles).length)document.getElementById('chartsHead').textContent+=' — no chart data yet';
// ---- learner dials
const setups=Object.keys(D.learner);
const dial=(name,key,base)=>({x:setups,y:setups.map(s=>{const v=D.learner[s][key];return v==null?base:v;}),
 type:'bar',name});
Plotly.newPlot('dials',[dial('size_mult','size_mult',1),dial('stop_mult (ATR)','stop_mult',D.base.stop_mult),
 dial('target_r','target_r',D.base.target_r)],
 {...L,barmode:'group',title:{text:'Learned dials per setup (vs base)',font:{size:13}},
  shapes:[{type:'line',x0:-.5,x1:setups.length-.5,y0:1,y1:1,line:{color:'#8a8f98',dash:'dash',width:1}}]},
 {displayModeBar:false});
Plotly.newPlot('expect',[{x:setups,y:setups.map(s=>D.learner[s].ema_r),type:'bar',name:'expectancy (EMA R)',
  marker:{color:setups.map(s=>D.learner[s].ema_r>=0?'#4caf7d':'#e05d5d')}},
 {x:setups,y:setups.map(s=>D.learner[s].threshold_shift),type:'bar',name:'threshold shift',marker:{color:'#7ab8f5'}}],
 {...L,barmode:'group',title:{text:'Expectancy & entry-threshold shift',font:{size:13}}},{displayModeBar:false});
// ---- adjustment timeline: size_mult per setup over time
const bySetup={};
for(const a of D.adjustments){if(a.dial!=='size_mult'||a.setup==='GLOBAL')continue;
 (bySetup[a.setup]??=({x:[],y:[]})).x.push(a.timestamp);bySetup[a.setup].y.push(parseFloat(a.new));}
Plotly.newPlot('adjline',Object.entries(bySetup).map(([s,d])=>({x:d.x,y:d.y,mode:'lines+markers',name:s,
 line:{shape:'hv'}})),{...L,title:{text:'Position-size multiplier over time (per setup)',font:{size:13}}},
 {displayModeBar:false});
// ---- live calculations
const a=D.ema_alpha;
document.getElementById('calcs').innerHTML=setups.map(s=>{const p=D.learner[s];
 const stop=p.stop_mult??D.base.stop_mult, tr=p.target_r??D.base.target_r;
 const risk=Math.min(D.base.risk_pct*p.size_mult,D.base.hard_cap).toFixed(2);
 return `<div class="panel" style="margin-bottom:10px"><b>${s}</b> — ${p.trades} trades, ${p.wins} wins
 <div class="formula">expectancy:  ema_r = ${(1-a)}·prev + ${a}·latest_R  =  ${(+p.ema_r).toFixed(3)} R
excursions:  ema_mae = ${(+p.ema_mae_r).toFixed(2)}R   ema_mfe = ${(+p.ema_mfe_r).toFixed(2)}R
size:        risk/trade = min(${D.base.risk_pct}% × ${p.size_mult}, ${D.base.hard_cap}% cap) = ${risk}%
entry bar:   score must beat ${D.base.min_score} + ${p.threshold_shift} = ${(D.base.min_score+ +p.threshold_shift).toFixed(1)}
trade plan:  stop = entry ∓ ${stop} × ATR      target = entry ± ${tr} × risk (RR 1:${tr})</div></div>`;}).join('')
 ||'<div class="sub">No closed trades yet — calculations appear after the first exits.</div>';
// ---- audit table
const rows=D.adjustments.slice(-40).reverse();
document.getElementById('adjtable').innerHTML='<tr><th>time</th><th>setup</th><th>dial</th><th>old→new</th><th>reason</th></tr>'+
 rows.map(r=>`<tr><td>${r.timestamp.slice(0,16).replace('T',' ')}</td><td>${r.setup}</td><td>${r.dial}</td>
 <td>${r.old} → ${r.new}</td><td>${r.reason}</td></tr>`).join('');
</script><script>window.addEventListener("resize",()=>document.querySelectorAll(".js-plotly-plot").forEach(p=>Plotly.Plots.resize(p)));</script></body></html>
